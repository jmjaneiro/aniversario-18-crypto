<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold & Crystal Gradients -->
    <linearGradient id="crystalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FCEAB0" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#E5C158" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9A751E" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="champagneLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D1" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#FFD768" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#D49B28" stop-opacity="0.35" />
    </linearGradient>

    <radialGradient id="toastGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFEFA8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#E5BE5E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#E5BE5E" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Golden Aura behind the Toast -->
  <circle cx="250" cy="180" r="160" fill="url(#toastGlow)" />

  <!-- Toasting Clink Sparkle Flare -->
  <g filter="url(#softGlow)">
    <!-- Central Clink Burst -->
    <circle cx="250" cy="140" r="8" fill="#FFFFFF" opacity="0.9" />
    <line x1="250" y1="90" x2="250" y2="190" stroke="#FFF7D6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="200" y1="140" x2="300" y2="140" stroke="#FFF7D6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="215" y1="105" x2="285" y2="175" stroke="#FFE793" stroke-width="2" stroke-linecap="round" />
    <line x1="285" y1="105" x2="215" y2="175" stroke="#FFE793" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Left Champagne Flute (Tilted ~14 deg to the right) -->
  <g transform="translate(250, 270) rotate(14) translate(-250, -270)">
    <!-- Liquid in Left Glass -->
    <path d="M 194,150 Q 192,230 205,255 Q 215,262 225,255 Q 238,230 236,150 Z" fill="url(#champagneLiquid)" />
    
    <!-- Rising Effervescent Bubbles (Left) -->
    <g fill="#FFFDF2" opacity="0.85">
      <circle cx="215" cy="245" r="2.2" />
      <circle cx="210" cy="225" r="1.8" />
      <circle cx="220" cy="205" r="2.5" />
      <circle cx="212" cy="185" r="1.5" />
      <circle cx="222" cy="170" r="2" />
      <circle cx="206" cy="155" r="2.2" />
      <circle cx="218" cy="142" r="1.5" />
    </g>

    <!-- Glass Bowl Contour -->
    <path d="M 190,110 Q 188,235 204,265 Q 215,273 226,265 Q 242,235 240,110 Z" fill="none" stroke="url(#crystalGold)" stroke-width="3" stroke-linecap="round" />
    <!-- Glass Rim -->
    <ellipse cx="215" cy="110" rx="25" ry="5.5" fill="none" stroke="url(#crystalGold)" stroke-width="2.5" />
    
    <!-- Slender Stem -->
    <path d="M 213,270 L 213,380 L 217,380 L 217,270 Z" fill="url(#crystalGold)" />
    <!-- Stem Flare/Node -->
    <ellipse cx="215" cy="272" rx="4" ry="2" fill="#FFF9DE" />
    <!-- Foot / Base -->
    <ellipse cx="215" cy="385" rx="36" ry="7" fill="none" stroke="url(#crystalGold)" stroke-width="3" />
    <ellipse cx="215" cy="385" rx="30" ry="5" fill="#FFEDB0" fill-opacity="0.15" />

    <!-- Crystal Highlight Reflection (Left Edge) -->
    <path d="M 193,125 Q 191,220 202,248" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Right Champagne Flute (Tilted ~14 deg to the left) -->
  <g transform="translate(250, 270) rotate(-14) translate(-250, -270)">
    <!-- Liquid in Right Glass -->
    <path d="M 264,150 Q 262,230 275,255 Q 285,262 295,255 Q 308,230 306,150 Z" fill="url(#champagneLiquid)" />
    
    <!-- Rising Effervescent Bubbles (Right) -->
    <g fill="#FFFDF2" opacity="0.85">
      <circle cx="285" cy="248" r="2" />
      <circle cx="280" cy="228" r="2.5" />
      <circle cx="290" cy="208" r="1.6" />
      <circle cx="282" cy="188" r="2.2" />
      <circle cx="292" cy="172" r="1.8" />
      <circle cx="278" cy="158" r="2.4" />
      <circle cx="288" cy="144" r="1.6" />
    </g>

    <!-- Glass Bowl Contour -->
    <path d="M 260,110 Q 258,235 274,265 Q 285,273 296,265 Q 312,235 310,110 Z" fill="none" stroke="url(#crystalGold)" stroke-width="3" stroke-linecap="round" />
    <!-- Glass Rim -->
    <ellipse cx="285" cy="110" rx="25" ry="5.5" fill="none" stroke="url(#crystalGold)" stroke-width="2.5" />

    <!-- Slender Stem -->
    <path d="M 283,270 L 283,380 L 287,380 L 287,270 Z" fill="url(#crystalGold)" />
    <!-- Stem Flare/Node -->
    <ellipse cx="285" cy="272" rx="4" ry="2" fill="#FFF9DE" />
    <!-- Foot / Base -->
    <ellipse cx="285" cy="385" rx="36" ry="7" fill="none" stroke="url(#crystalGold)" stroke-width="3" />
    <ellipse cx="285" cy="385" rx="30" ry="5" fill="#FFEDB0" fill-opacity="0.15" />

    <!-- Crystal Highlight Reflection (Right Edge) -->
    <path d="M 307,125 Q 309,220 298,248" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Floating Golden Celebration Sparkles -->
  <g fill="#FFECA1">
    <circle cx="160" cy="130" r="2.5" opacity="0.75" />
    <circle cx="340" cy="125" r="2.5" opacity="0.75" />
    <circle cx="250" cy="70" r="3" opacity="0.9" />
    <circle cx="180" cy="80" r="2" opacity="0.6" />
    <circle cx="320" cy="75" r="2" opacity="0.6" />
    <circle cx="140" cy="200" r="2" opacity="0.5" />
    <circle cx="360" cy="200" r="2" opacity="0.5" />
    <!-- Sparkle Stars -->
    <path d="M 250,45 Q 250,55 255,55 Q 250,55 250,65 Q 250,55 245,55 Q 250,55 250,45 Z" fill="#FFF6D1" />
    <path d="M 170,165 Q 170,172 174,172 Q 170,172 170,179 Q 170,172 166,172 Q 170,172 170,165 Z" fill="#FFE894" />
    <path d="M 330,160 Q 330,167 334,167 Q 330,167 330,174 Q 330,167 326,167 Q 330,167 330,160 Z" fill="#FFE894" />
  </g>
</svg>
