<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Rim Gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#8A6B1C" />
      <stop offset="70%" stop-color="#FDF0A6" />
      <stop offset="100%" stop-color="#AA7E1A" />
    </linearGradient>

    <!-- Coin Face Gradient -->
    <radialGradient id="goldFace" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#B88A24" />
      <stop offset="90%" stop-color="#7B560E" />
      <stop offset="100%" stop-color="#4E3304" />
    </radialGradient>

    <!-- Bevel Inner Ring Gradient -->
    <linearGradient id="innerBevel" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFF2A1" />
      <stop offset="50%" stop-color="#AA801E" />
      <stop offset="100%" stop-color="#553A04" />
    </linearGradient>

    <!-- Bitcoin Symbol Gradient -->
    <linearGradient id="btcSymbol" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF3B3" />
      <stop offset="70%" stop-color="#E1B842" />
      <stop offset="100%" stop-color="#946C11" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#362100" flood-opacity="0.9" />
      <feDropShadow dx="-1" dy="-2" stdDeviation="1" flood-color="#FFF8D6" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="8" filter="url(#goldGlow)" />

  <!-- Outer Coin Edge -->
  <circle cx="250" cy="250" r="225" fill="url(#goldRim)" stroke="#4A3408" stroke-width="3" />

  <!-- Reeded Edge Pattern (Teeth around the perimeter) -->
  <g stroke="#7F5F17" stroke-width="2.5" opacity="0.65">
    <!-- Generated circular tick marks -->
    <circle cx="250" cy="250" r="215" fill="none" stroke="#5C410B" stroke-width="4" stroke-dasharray="4, 5.5" />
  </g>

  <!-- Secondary Inner Ring -->
  <circle cx="250" cy="250" r="202" fill="url(#innerBevel)" stroke="#FFF4B8" stroke-width="1.5" />
  <circle cx="250" cy="250" r="195" fill="url(#goldFace)" filter="url(#emboss)" />

  <!-- Circular Text Engravings -->
  <path id="textPathTop" d="M 90,250 A 160,160 0 0,1 410,250" fill="none" />
  <path id="textPathBottom" d="M 410,250 A 160,160 0 0,1 90,250" fill="none" />

  <text fill="#FFECA1" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="13" font-weight="700" letter-spacing="4" opacity="0.95">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ★ CHAPTER 18 • GOLDEN MILESTONE ★
    </textPath>
  </text>

  <text fill="#FFECA1" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="12" font-weight="700" letter-spacing="4" opacity="0.95">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ★ FREEDOM • INDEPENDENCE • FUTURE ★
    </textPath>
  </text>

  <!-- Inner Circuit Border -->
  <circle cx="250" cy="250" r="142" fill="none" stroke="#E0B647" stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="8, 3, 2, 3" />
  <circle cx="250" cy="250" r="134" fill="none" stroke="#875E0D" stroke-width="1.5" />

  <!-- Center Decorative Glow -->
  <circle cx="250" cy="250" r="126" fill="#A87919" fill-opacity="0.25" />

  <!-- Central Bitcoin Symbol -->
  <g filter="url(#emboss)">
    <!-- Circuit lines on coin background -->
    <g stroke="#E5BE5E" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
      <path d="M 180,190 L 155,190 L 140,210" fill="none" />
      <circle cx="140" cy="210" r="2.5" fill="#FFEAA3" />
      <path d="M 175,310 L 150,310 L 138,290" fill="none" />
      <circle cx="138" cy="290" r="2.5" fill="#FFEAA3" />
      <path d="M 320,190 L 345,190 L 360,210" fill="none" />
      <circle cx="360" cy="210" r="2.5" fill="#FFEAA3" />
      <path d="M 325,310 L 350,310 L 362,290" fill="none" />
      <circle cx="362" cy="290" r="2.5" fill="#FFEAA3" />
    </g>

    <!-- Bold Iconic Bitcoin Symbol ₿ -->
    <path fill="url(#btcSymbol)" stroke="#664605" stroke-width="2" d="
      M 228,145 L 244,145 L 244,166 C 255,166 285,164 296,176 C 308,189 308,206 295,217 C 308,225 315,242 308,261 C 298,285 273,288 244,288 L 244,310 L 228,310 L 228,288 L 210,288 L 210,310 L 194,310 L 194,288 L 165,288 L 165,268 L 184,268 C 190,268 192,265 192,260 L 192,192 C 192,187 189,184 184,184 L 165,184 L 165,166 L 194,166 L 194,145 L 210,145 L 210,166 L 228,166 Z
      M 218,187 L 218,217 L 242,217 C 258,217 268,212 268,202 C 268,191 259,187 243,187 Z
      M 218,237 L 218,268 L 246,268 C 264,268 274,261 274,252 C 274,242 263,237 245,237 Z
    " />
    
    <!-- Vertical dual prongs for precision -->
    <rect x="228" y="132" width="13" height="20" rx="3" fill="url(#btcSymbol)" stroke="#664605" stroke-width="1.5" />
    <rect x="210" y="132" width="13" height="20" rx="3" fill="url(#btcSymbol)" stroke="#664605" stroke-width="1.5" />
    <rect x="228" y="302" width="13" height="20" rx="3" fill="url(#btcSymbol)" stroke="#664605" stroke-width="1.5" />
    <rect x="210" y="302" width="13" height="20" rx="3" fill="url(#btcSymbol)" stroke="#664605" stroke-width="1.5" />
  </g>

  <!-- Light Sheen Reflection Arc -->
  <path d="M 120,110 A 185,185 0 0,1 380,110 A 180,150 0 0,0 120,110 Z" fill="#FFFFFF" fill-opacity="0.25" />
</svg>
