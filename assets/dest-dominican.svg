<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="caribbeanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E192B" />
      <stop offset="35%" stop-color="#202A44" />
      <stop offset="60%" stop-color="#6F3956" />
      <stop offset="78%" stop-color="#BA564E" />
      <stop offset="100%" stop-color="#F39C43" />
    </linearGradient>
    <linearGradient id="tropicalSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="50%" stop-color="#FFCE54" />
      <stop offset="100%" stop-color="#FC6E51" />
    </linearGradient>
    <linearGradient id="caribbeanSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C26A3B" />
      <stop offset="25%" stop-color="#2D5C6E" />
      <stop offset="65%" stop-color="#0E3D4D" />
      <stop offset="100%" stop-color="#051D26" />
    </linearGradient>
    <linearGradient id="sandGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B120E" />
      <stop offset="100%" stop-color="#2C1A12" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#caribbeanSky)" />

  <!-- Tropical Giant Setting Sun -->
  <circle cx="300" cy="235" r="75" fill="url(#tropicalSun)" />
  <circle cx="300" cy="235" r="110" fill="#FFA534" opacity="0.25" filter="blur(25px)" />

  <!-- Horizon Line & Distant Samaná Peninsula Mountain Silhouette -->
  <path d="M 0,250 Q 80,244 160,248 Q 230,241 300,247 Q 380,243 470,247 Q 540,242 600,248 L 600,255 L 0,255 Z" fill="#3D1C28" opacity="0.7" />

  <!-- Caribbean Ocean Surface -->
  <rect x="0" y="250" width="600" height="150" fill="url(#caribbeanSea)" />

  <!-- Golden Sun Reflections on Gentle Waves -->
  <g stroke="#FFE899" stroke-linecap="round" opacity="0.75">
    <line x1="285" y1="256" x2="315" y2="256" stroke-width="2.5" />
    <line x1="265" y1="263" x2="335" y2="263" stroke-width="3" />
    <line x1="240" y1="272" x2="360" y2="272" stroke-width="3.5" />
    <line x1="220" y1="284" x2="380" y2="284" stroke-width="3.5" />
    <line x1="190" y1="298" x2="410" y2="298" stroke-width="4" stroke="#FFCE54" />
    <line x1="170" y1="315" x2="430" y2="315" stroke-width="4.5" stroke="#FFA726" />
    <line x1="140" y1="335" x2="460" y2="335" stroke-width="4" stroke="#FF9800" opacity="0.5" />
  </g>

  <!-- Caribbean Shore & Sand Dunes Silhouette -->
  <path d="M 0,330 Q 150,330 250,350 Q 420,380 600,340 L 600,400 L 0,400 Z" fill="url(#sandGlow)" />

  <!-- Graceful Slender Palm Trees (Right Side) -->
  <g fill="#170F0A">
    <!-- Main Tall Curved Palm Trunk -->
    <path d="M 520,400 Q 505,300 455,170 Q 450,155 440,140 Q 448,150 460,175 Q 515,300 535,400 Z" />
    
    <!-- Palm Fronds Canopy (Center: 440, 140) -->
    <!-- Frond 1 (Top Left) -->
    <path d="M 440,140 Q 380,110 320,135 Q 365,145 440,140 Z" />
    <path d="M 440,140 Q 360,80 340,65 Q 380,105 440,140 Z" />
    <!-- Frond 2 (Up) -->
    <path d="M 440,140 Q 430,70 410,40 Q 440,85 440,140 Z" />
    <path d="M 440,140 Q 470,60 490,45 Q 470,95 440,140 Z" />
    <!-- Frond 3 (Right) -->
    <path d="M 440,140 Q 520,85 555,100 Q 500,120 440,140 Z" />
    <path d="M 440,140 Q 535,130 570,165 Q 495,155 440,140 Z" />
    <!-- Frond 4 (Bottom Left drooping) -->
    <path d="M 440,140 Q 365,160 335,210 Q 385,180 440,140 Z" />
    <path d="M 440,140 Q 410,185 390,235 Q 430,195 440,140 Z" />

    <!-- Second Smaller Curved Palm Tree -->
    <path d="M 565,400 Q 560,320 535,220 Q 532,205 522,190 Q 529,202 540,225 Q 570,320 580,400 Z" />
    <!-- Smaller Canopy (522, 190) -->
    <path d="M 522,190 Q 470,160 435,180 Q 475,190 522,190 Z" />
    <path d="M 522,190 Q 510,130 500,105 Q 525,145 522,190 Z" />
    <path d="M 522,190 Q 570,145 600,155 Q 565,175 522,190 Z" />
    <path d="M 522,190 Q 580,190 600,230 Q 555,215 522,190 Z" />
  </g>

  <!-- Left Side Distant Palm Tree Silhouette -->
  <g fill="#1D120D">
    <path d="M 70,345 Q 60,280 40,210 Q 47,215 65,280 Q 75,345 78,350 Z" />
    <path d="M 40,210 Q 0,180 -20,195 Q 10,205 40,210 Z" />
    <path d="M 40,210 Q 30,160 20,140 Q 38,175 40,210 Z" />
    <path d="M 40,210 Q 80,175 105,185 Q 75,200 40,210 Z" />
    <path d="M 40,210 Q 85,220 95,250 Q 65,235 40,210 Z" />
  </g>

  <!-- Luxury Badge Top -->
  <rect x="20" y="20" width="225" height="28" rx="14" fill="#0C1524" stroke="#D4AF37" stroke-width="1" opacity="0.9" />
  <text x="132" y="38" fill="#FFEAA3" font-family="'Cinzel', Georgia, serif" font-size="10.5" font-weight="700" letter-spacing="2" text-anchor="middle">REPÚBLICA DOMINICANA</text>
</svg>
