<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nycSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#141829" />
      <stop offset="85%" stop-color="#2D2338" />
      <stop offset="100%" stop-color="#54333A" />
    </linearGradient>
    <linearGradient id="goldHaze" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E5A638" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E5A638" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="nycBuilding1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121522" />
      <stop offset="100%" stop-color="#1E2338" />
    </linearGradient>
    <linearGradient id="nycBuilding2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E101B" />
      <stop offset="100%" stop-color="#181D2E" />
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFEAA3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFEAA3" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" fill="url(#nycSky)" />

  <!-- Stars -->
  <g fill="#FFF8DE" opacity="0.8">
    <circle cx="50" cy="40" r="1.2" />
    <circle cx="120" cy="70" r="1" />
    <circle cx="210" cy="30" r="1.5" />
    <circle cx="340" cy="65" r="1" />
    <circle cx="430" cy="45" r="1.8" />
    <circle cx="520" cy="80" r="1.2" />
    <circle cx="570" cy="35" r="1.5" />
    <circle cx="160" cy="110" r="0.8" />
    <circle cx="280" cy="95" r="1.2" />
    <circle cx="490" cy="120" r="1" />
  </g>

  <!-- Golden Moon / Ambient Glow -->
  <circle cx="480" cy="110" r="45" fill="#FFE89E" opacity="0.15" filter="blur(20px)" />
  <circle cx="480" cy="110" r="28" fill="#FFF2BD" opacity="0.9" />
  <circle cx="472" cy="105" r="26" fill="#141829" />

  <!-- Golden Skyline Horizon Glow -->
  <rect x="0" y="240" width="600" height="160" fill="url(#goldHaze)" />

  <!-- Searchlight Beams -->
  <polygon points="170,330 130,0 160,0" fill="url(#goldBeam)" />
  <polygon points="360,330 420,0 390,0" fill="url(#goldBeam)" />

  <!-- Background Layer Buildings (Distant) -->
  <g fill="#101321" opacity="0.6">
    <rect x="30" y="200" width="45" height="200" />
    <rect x="95" y="160" width="50" height="240" />
    <rect x="220" y="140" width="40" height="260" />
    <rect x="380" y="170" width="55" height="230" />
    <rect x="490" y="190" width="60" height="210" />
  </g>

  <!-- Midground Skyline -->
  <g fill="url(#nycBuilding1)">
    <!-- Empire-Style Tower (Left Center) -->
    <rect x="170" y="130" width="55" height="270" />
    <polygon points="170,130 197,90 225,130" />
    <rect x="195" y="60" width="5" height="30" fill="#FFE082" />
    <circle cx="197" cy="58" r="2" fill="#FF5252" />

    <!-- Chrysler-style Spire (Right Center) -->
    <rect x="325" y="150" width="65" height="250" />
    <polygon points="325,150 357,110 390,150" />
    <rect x="355" y="75" width="4" height="35" fill="#E5C158" />

    <!-- Modern Tower Blocks -->
    <rect x="420" y="180" width="70" height="220" />
    <rect x="70" y="220" width="60" height="180" />
    <rect x="250" y="210" width="60" height="190" />
  </g>

  <!-- Foreground Silhouettes with Illuminated Windows -->
  <g fill="url(#nycBuilding2)">
    <rect x="0" y="260" width="65" height="140" />
    <rect x="110" y="240" width="75" height="160" />
    <rect x="270" y="250" width="80" height="150" />
    <rect x="460" y="230" width="90" height="170" />
    <rect x="540" y="270" width="60" height="130" />
  </g>

  <!-- Glowing Golden Windows Pattern -->
  <g fill="#FFECA1" opacity="0.75">
    <circle cx="185" cy="150" r="1.5" /><circle cx="195" cy="150" r="1.5" /><circle cx="205" cy="150" r="1.5" />
    <circle cx="185" cy="165" r="1.5" /><circle cx="205" cy="165" r="1.5" />
    <circle cx="185" cy="180" r="1.5" /><circle cx="195" cy="180" r="1.5" /><circle cx="205" cy="180" r="1.5" />
    <circle cx="185" cy="200" r="1.5" /><circle cx="195" cy="200" r="1.5" />
    
    <circle cx="340" cy="170" r="1.5" /><circle cx="355" cy="170" r="1.5" /><circle cx="370" cy="170" r="1.5" />
    <circle cx="340" cy="190" r="1.5" /><circle cx="370" cy="190" r="1.5" />
    <circle cx="340" cy="210" r="1.5" /><circle cx="355" cy="210" r="1.5" />

    <circle cx="130" cy="260" r="2" /><circle cx="150" cy="260" r="2" />
    <circle cx="130" cy="285" r="2" /><circle cx="160" cy="285" r="2" />
    <circle cx="140" cy="310" r="2" /><circle cx="155" cy="310" r="2" />

    <circle cx="290" cy="275" r="2" /><circle cx="310" cy="275" r="2" /><circle cx="330" cy="275" r="2" />
    <circle cx="290" cy="305" r="2" /><circle cx="320" cy="305" r="2" />
    
    <circle cx="480" cy="255" r="2" /><circle cx="505" cy="255" r="2" /><circle cx="525" cy="255" r="2" />
    <circle cx="490" cy="280" r="2" /><circle cx="520" cy="280" r="2" />
    <circle cx="480" cy="310" r="2" /><circle cx="510" cy="310" r="2" />
  </g>

  <!-- Water Reflection (East River / Hudson) -->
  <rect x="0" y="375" width="600" height="25" fill="#0A0D17" />
  <g stroke="#E5B258" stroke-width="1.2" opacity="0.4">
    <line x1="80" y1="382" x2="160" y2="382" />
    <line x1="180" y1="385" x2="230" y2="385" />
    <line x1="280" y1="383" x2="360" y2="383" />
    <line x1="470" y1="385" x2="550" y2="385" />
    <line x1="120" y1="392" x2="210" y2="392" />
    <line x1="320" y1="391" x2="410" y2="391" />
  </g>

  <!-- Luxury Badge Top -->
  <rect x="20" y="20" width="130" height="28" rx="14" fill="#0E1222" stroke="#D4AF37" stroke-width="1" opacity="0.9" />
  <text x="85" y="38" fill="#FFEAA3" font-family="'Cinzel', Georgia, serif" font-size="10.5" font-weight="700" letter-spacing="2" text-anchor="middle">NEW YORK</text>
</svg>
