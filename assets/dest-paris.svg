<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="parisSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080714" />
      <stop offset="40%" stop-color="#1B1429" />
      <stop offset="75%" stop-color="#361D36" />
      <stop offset="100%" stop-color="#5E2B48" />
    </linearGradient>
    <linearGradient id="eiffelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="40%" stop-color="#E5C158" />
      <stop offset="80%" stop-color="#AA7E1A" />
      <stop offset="100%" stop-color="#644406" />
    </linearGradient>
    <radialGradient id="towerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFDF85" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#E5A638" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#E5A638" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="eiffelBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF6D1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFF6D1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" fill="url(#parisSky)" />

  <!-- Stars & Champagne Bubbles -->
  <g fill="#FFFDE8">
    <circle cx="80" cy="50" r="1.5" opacity="0.9" />
    <circle cx="150" cy="90" r="1" opacity="0.7" />
    <circle cx="230" cy="40" r="1.8" opacity="0.8" />
    <circle cx="370" cy="55" r="1.2" opacity="0.9" />
    <circle cx="450" cy="85" r="1.5" opacity="0.8" />
    <circle cx="530" cy="45" r="1" opacity="0.7" />
    <circle cx="100" cy="130" r="1.2" opacity="0.6" />
    <circle cx="500" cy="120" r="1.6" opacity="0.75" />
  </g>

  <!-- Giant Paris Moon -->
  <circle cx="130" cy="100" r="36" fill="#FFF6D6" opacity="0.85" />
  <circle cx="130" cy="100" r="50" fill="#FFEDB0" opacity="0.15" filter="blur(15px)" />

  <!-- Eiffel Ambient Aura -->
  <ellipse cx="300" cy="210" rx="140" ry="170" fill="url(#towerGlow)" />

  <!-- Rotating Searchlight Beam of the Eiffel Tower -->
  <polygon points="300,52 600,0 600,60" fill="url(#eiffelBeam)" />

  <!-- Distant Paris Haussmann Rooftops Silhouette -->
  <g fill="#161224" opacity="0.8">
    <rect x="0" y="310" width="180" height="90" />
    <polygon points="0,310 40,290 90,310 140,295 180,310" fill="#1C172E" />
    <rect x="420" y="310" width="180" height="90" />
    <polygon points="420,310 460,295 510,310 560,290 600,310" fill="#1C172E" />
    <!-- Chimney Pots -->
    <rect x="50" y="280" width="6" height="12" fill="#161224" />
    <rect x="120" y="285" width="5" height="12" fill="#161224" />
    <rect x="475" y="285" width="6" height="12" fill="#161224" />
    <rect x="545" y="280" width="5" height="12" fill="#161224" />
  </g>

  <!-- Champ de Mars Trees & Bridge -->
  <g fill="#130D1F">
    <ellipse cx="200" cy="360" rx="45" ry="30" />
    <ellipse cx="230" cy="365" rx="35" ry="25" />
    <ellipse cx="370" cy="365" rx="35" ry="25" />
    <ellipse cx="400" cy="360" rx="45" ry="30" />
    <rect x="0" y="365" width="600" height="35" fill="#0C0814" />
  </g>

  <!-- The Eiffel Tower (Detailed Golden Architectural Silhouette) -->
  <g fill="url(#eiffelGold)" stroke="#3E2907" stroke-width="0.7">
    <!-- Spire & Lantern Top -->
    <line x1="300" y1="45" x2="300" y2="70" stroke="#FFEAA3" stroke-width="2.5" />
    <circle cx="300" cy="46" r="3" fill="#FFF2BD" />
    <rect x="296" y="68" width="8" height="10" rx="1" fill="#FFEAA3" />

    <!-- Top Tier -->
    <polygon points="296,78 304,78 307,135 293,135" />
    <!-- 3rd Platform -->
    <rect x="288" y="135" width="24" height="6" rx="2" fill="#FFEAA3" />

    <!-- Mid Section Lattice -->
    <polygon points="293,141 307,141 315,225 285,225" />
    <!-- Double Platform (2nd Floor) -->
    <rect x="278" y="225" width="44" height="9" rx="2" fill="#FFEAA3" />
    <rect x="274" y="234" width="52" height="4" fill="#D4AF37" />

    <!-- Lower Section Pillars and Famous Archway -->
    <!-- Left Leg -->
    <polygon points="280,238 290,238 250,360 220,360" />
    <!-- Right Leg -->
    <polygon points="310,238 320,238 380,360 350,360" />
    
    <!-- Grand Arch -->
    <path d="M 245,360 Q 300,270 355,360" fill="none" stroke="url(#eiffelGold)" stroke-width="8" />
    <path d="M 252,360 Q 300,285 348,360" fill="none" stroke="#FFECA1" stroke-width="2" />

    <!-- Internal Lattice Bracing Struts -->
    <g stroke="#916B13" stroke-width="1.2" opacity="0.85">
      <line x1="294" y1="90" x2="306" y2="105" />
      <line x1="306" y1="90" x2="294" y2="105" />
      <line x1="293" y1="110" x2="307" y2="125" />
      <line x1="307" y1="110" x2="293" y2="125" />

      <line x1="292" y1="150" x2="308" y2="175" />
      <line x1="308" y1="150" x2="292" y2="175" />
      <line x1="289" y1="180" x2="311" y2="210" />
      <line x1="311" y1="180" x2="289" y2="210" />

      <line x1="278" y1="250" x2="260" y2="300" />
      <line x1="322" y1="250" x2="340" y2="300" />
    </g>
  </g>

  <!-- Golden Seine River Reflection -->
  <g stroke="#E5B258" stroke-width="1.5" opacity="0.45">
    <line x1="285" y1="375" x2="315" y2="375" />
    <line x1="265" y1="382" x2="335" y2="382" />
    <line x1="250" y1="388" x2="350" y2="388" />
    <line x1="280" y1="394" x2="320" y2="394" />
  </g>

  <!-- Luxury Badge Top -->
  <rect x="20" y="20" width="110" height="28" rx="14" fill="#140D22" stroke="#D4AF37" stroke-width="1" opacity="0.9" />
  <text x="75" y="38" fill="#FFEAA3" font-family="'Cinzel', Georgia, serif" font-size="10.5" font-weight="700" letter-spacing="2" text-anchor="middle">PARIS</text>
</svg>
